<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!--UNORDERED LIST-->
    <h2>UNORDERED LISTS</h2>
    <ul>
      <li>
        Apple
        <ul>
          <li>color: red</li>
          <li>season: all</li>
        </ul>
      </li>
      <li>
        Mango
        <ul>
          <li>color: yellow</li>
          <li>season: summers</li>
        </ul>
      </li>
    </ul>

    <!--ORDERED LISTS-->
    <h2>ORDERED LISTS</h2>
    <ol>
      <li>
        Apple
        <ol type="a">
          <li>color: red</li>
          <li>season: all</li>
        </ol>
      </li>
      <li>
        Mango
        <ol type="a">
          <li>color: yellow</li>
          <li>season: summers</li>
        </ol>
      </li>
    </ol>
  </body>
</html>
