<!doctype html>
<html>
  <head>
    <title>HTML Forms Demo</title>
  </head>
  <body>
    <h1>Student Registration Form</h1>

    <!-- action attribute specifies where form data is sent -->
    <form action="submit.php" method="post">
      <!-- Text Input -->
      <label for="name">Full Name:</label>
      <input
        type="text"
        id="name"
        name="fullname"
        placeholder="Enter your full name"
      />
      <br /><br />

      <!-- Email Input -->
      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
      />
      <br /><br />

      <!-- Password Input -->
      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter password"
      />
      <br /><br />

      <!-- Number Input -->
      <label for="age">Age:</label>
      <input type="number" id="age" name="age" placeholder="Enter age" />
      <br /><br />

      <!-- Checkbox -->
      <label>Skills:</label><br />

      <input type="checkbox" id="html" name="skills" value="HTML" />
      <label for="html">HTML</label>

      <input type="checkbox" id="css" name="skills" value="CSS" />
      <label for="css">CSS</label>

      <input type="checkbox" id="js" name="skills" value="JavaScript" />
      <label for="js">JavaScript</label>

      <br /><br />

      <!-- Radio Buttons -->
      <label>Gender:</label><br />

      <input type="radio" id="male" name="gender" value="Male" />
      <label for="male">Male</label>

      <input type="radio" id="female" name="gender" value="Female" />
      <label for="female">Female</label>

      <input type="radio" id="other" name="gender" value="Other" />
      <label for="other">Other</label>

      <br /><br />

      <!-- Select Dropdown -->
      <label for="course">Select Course:</label>
      <select id="course" name="course">
        <option value="">--Choose Course--</option>
        <option value="BCA">BCA</option>
        <option value="BTech">BTech</option>
        <option value="MCA">MCA</option>
        <option value="MBA">MBA</option>
      </select>

      <br /><br />

      <!-- Range Input -->
      <label for="rating">Rate HTML Knowledge:</label>
      <input type="range" id="rating" name="rating" min="0" max="10" />

      <br /><br />

      <!-- Textarea -->
      <label for="message">About Yourself:</label><br />
      <textarea
        id="message"
        name="about"
        rows="5"
        cols="40"
        placeholder="Write something about yourself"
      ></textarea>

      <br /><br />

      <!-- Button Element -->
      <button type="submit">Submit Form</button>

      <!-- Input Type Button -->
      <input type="reset" value="Reset Form" />
    </form>
  </body>
</html>
